[[case]]
id = "TANDIR-A-C8"
kind = "control"
family = "authorization"
cwe = "CWE-639"
title = "Admin order lookup reads any order by design"
route = "GET /admin/orders/{order_id}"
path = "api/tandir/routers/admin.py"
symbol = "admin_get_order"
lines = [56, 65]
expected = "rejected"
anchors = ["order = db.get(Order, order_id)"]
guard = "Depends(admin_only)"
