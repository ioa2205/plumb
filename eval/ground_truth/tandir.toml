# B. SQL and OS command injection

[[case]]
id = "TANDIR-B1"
kind = "flaw"
family = "injection"
cwe = "CWE-89"
title = "Admin order search builds ORDER BY from a query parameter"
route = "GET /admin/orders"
path = "api/tandir/routers/admin.py"
symbol = "search_orders"
lines = [18, 33]
expected = "supported"
pair = "admin-search"
anchors = ['sort: str = "created_at"', 'f"WHERE users.display_name LIKE :q ORDER BY {sort}"']
fix = { removes = ["ORDER BY {sort}"], adds = ["ORDER_SORTS.get(sort)"] }

[[case]]
id = "TANDIR-B1-L"
kind = "lookalike"
family = "injection"
cwe = "CWE-89"
title = "Customer search binds the name and sorts through an allowlist"
route = "GET /admin/customers"
path = "api/tandir/routers/admin.py"
symbol = "search_customers"
lines = [36, 53]
expected = "rejected"
pair = "admin-search"
anchors = ['''f"WHERE role = 'customer' AND display_name LIKE :name ORDER BY {column}"''', '{"name": f"%{name}%"}']
guard = "CUSTOMER_SORTS.get(sort)"

[[case]]
id = "TANDIR-B2"
kind = "flaw"
family = "injection"
cwe = "CWE-78"
title = "Cake inscription reaches a label-printer command run with shell=True"
route = "POST /kitchen/orders/{order_id}/items/{item_id}/label"
path = "api/tandir/routers/kitchen.py"
symbol = "print_cake_label"
lines = [27, 42]
expected = "supported"
pair = "kitchen-printing"
anchors = ["item.inscription or item.name", "subprocess.run(command, shell=True, check=True, timeout=10)"]
fix = { removes = ["shell=True"], adds = ['["tandir-label", "--order", str(order.id), "--text", item.inscription or item.name]'] }

[[case]]
id = "TANDIR-B2-L"
kind = "lookalike"
family = "injection"
cwe = "CWE-78"
title = "Receipt printing passes an argument list"
route = "POST /kitchen/orders/{order_id}/receipt"
path = "api/tandir/routers/kitchen.py"
symbol = "print_receipt"
lines = [45, 60]
expected = "rejected"
pair = "kitchen-printing"
anchors = ["customer = order.customer.display_name"]
guard = '["tandir-receipt", "--order", str(order.id), "--customer", customer]'

# C. Path traversal

[[case]]
id = "TANDIR-C1"
kind = "flaw"
family = "path_traversal"
cwe = "CWE-22"
title = "Cake reference-photo download joins a user-supplied file name"
route = "GET /orders/{order_id}/photos?name="
path = "api/tandir/routers/orders.py"
symbol = "download_photo"
lines = [167, 179]
expected = "supported"
pair = "file-download"
anchors = ["name: str", "path = request.app.state.settings.photo_dir / str(order.id) / name", "return FileResponse(path)"]
fix = { removes = ["path = request.app.state.settings.photo_dir / str(order.id) / name"], adds = ["path.is_relative_to(folder)"] }

[[case]]
id = "TANDIR-C1-L"
kind = "lookalike"
family = "path_traversal"
cwe = "CWE-22"
title = "Avatar download resolves the path and checks containment"
route = "GET /avatars?name="
path = "api/tandir/routers/files.py"
symbol = "get_avatar"
lines = [7, 13]
expected = "rejected"
pair = "file-download"
anchors = ["path = (root / name).resolve()", "return FileResponse(path)"]
guard = "if not path.is_relative_to(root) or not path.is_file():"

# D. Next.js boundary exposure

[[case]]
id = "TANDIR-D1"
kind = "flaw"
family = "nextjs_exposure"
cwe = "CWE-862"
title = "Server Action refundOrder has no authorization"
route = "Server Action refundOrder (app/backoffice)"
path = "web/app/backoffice/actions.ts"
symbol = "refundOrder"
lines = [7, 11]
expected = "supported"
pair = "order-actions"
anchors = ["UPDATE orders SET status = 'refunded'"]
note = "The back office page checks the role, but a Server Action is a public POST endpoint (PROJECT_PLAN §4)."
fix = { removes = ["UPDATE orders SET status = 'refunded'"], adds = ["await refundOrderAsStaff(orderId);"] }

[[case]]
id = "TANDIR-D1-L"
kind = "lookalike"
family = "nextjs_exposure"
cwe = "CWE-862"
title = "Server Action cancelOrder verifies the session in the Data Access Layer"
route = "Server Action cancelOrder (app/orders)"
path = "web/app/orders/actions.ts"
symbol = "cancelOrder"
lines = [7, 11]
expected = "rejected"
pair = "order-actions"
anchors = ['const orderId = Number(formData.get("orderId"));']
guard = "await cancelOrderFor(orderId);"
guard_definition = "web/lib/dal.ts::cancelOrderFor"

[[case]]
id = "TANDIR-D2"
kind = "flaw"
family = "nextjs_exposure"
cwe = "CWE-200"
title = "Courier page passes the full customer record, with phone history, to a Client Component"
route = "GET /courier/{id}"
path = "web/app/courier/[id]/page.tsx"
symbol = "DeliveryPage"
lines = [5, 9]
expected = "supported"
pair = "client-props"
anchors = ["<DeliveryCard order={delivery.order} customer={delivery.customer} />"]
note = "The card shows only the name and address; the phone and phone history are serialized to the browser unused."
fix = { path = "web/lib/dal.ts", symbol = "getDelivery", removes = ["customerRecord(order.customer_id)"], adds = ["deliveryCustomer(order.customer_id)"] }

[[case]]
id = "TANDIR-D2-L"
kind = "lookalike"
family = "nextjs_exposure"
cwe = "CWE-200"
title = "Order page passes a minimal DTO to its Client Component"
route = "GET /orders/{id}"
path = "web/app/orders/[id]/page.tsx"
symbol = "OrderPage"
lines = [5, 9]
expected = "rejected"
pair = "client-props"
anchors = ["<OrderSummary order={order} />"]
guard = "await getOrderDTO(Number(id))"
guard_definition = "web/lib/dal.ts::getOrderDTO"

[[case]]
id = "TANDIR-D3"
kind = "flaw"
family = "nextjs_exposure"
cwe = "CWE-862"
title = "/api/admin/export is protected only by the proxy.ts matcher"
route = "GET /api/admin/export"
path = "web/app/api/admin/export/route.ts"
symbol = "GET"
lines = [9, 20]
expected = "supported"
pair = "admin-routes"
anchors = ["export function GET(): Response {", "SELECT id, display_name, phone FROM users"]
note = "proxy.ts checks the admin role for this path; the handler itself does not (proxy is an optimistic layer, PROJECT_PLAN §4)."
fix = { removes = ["export function GET(): Response {"], adds = ['if (!viewer.is("admin"))'] }

[[case]]
id = "TANDIR-D3-L"
kind = "lookalike"
family = "nextjs_exposure"
cwe = "CWE-862"
title = "/api/admin/reports checks the role in the handler"
route = "GET /api/admin/reports"
path = "web/app/api/admin/reports/route.ts"
symbol = "GET"
lines = [6, 18]
expected = "rejected"
pair = "admin-routes"
anchors = ["viewerForToken(request.cookies.get(SESSION_COOKIE)?.value)"]
guard = 'if (!viewer.is("admin"))'
