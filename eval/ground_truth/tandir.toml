[[case]]
id = "TANDIR-A-C7"
kind = "control"
family = "authorization"
cwe = "CWE-639"
title = "Courier sees only orders assigned to them"
route = "GET /courier/orders/{order_id}"
path = "api/tandir/routers/courier.py"
symbol = "delivery_detail"
