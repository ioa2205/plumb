# Ground truth for the hand-written Tandir lab (PROJECT_PLAN §10.1, task M1.4, ADR-0005).
#
# Paths are relative to the lab root, which is what Plumb reviews. `lines` is the
# symbol's whole span (decorators through its last line), as in the mutation corpus.
# Validated against the code by `uv run python -m eval.ground_truth check`:
# spans, anchors, guards, and the fixed snapshot (labs/tandir/fixed).
#
# kind = "flaw"      intentional flaw; expected "supported"; `fix` says what the fixed snapshot changes
# kind = "lookalike" its protected twin (same `pair`); expected "rejected", citing `guard`
# kind = "control"   another defended site of the same kind; expected "rejected", citing `guard`

root = "labs/tandir"

# A. Object- and tenant-level authorization

[[case]]
id = "TANDIR-A1"
kind = "flaw"
family = "authorization"
cwe = "CWE-639"
title = "Receipt loads any customer's order"
route = "GET /orders/{order_id}/receipt"
path = "api/tandir/routers/orders.py"
symbol = "get_receipt"
lines = [82, 91]
expected = "supported"
pair = "order-documents"
anchors = ["order = db.get(Order, order_id)", "return ReceiptOut.from_order(order)"]
fix = { removes = ["order = db.get(Order, order_id)"], adds = ["load_order_scoped(db, order_id, user)"] }

[[case]]
id = "TANDIR-A1-L"
kind = "lookalike"
family = "authorization"
cwe = "CWE-639"
title = "Invoice uses a scoped loader defined in another file"
route = "GET /orders/{order_id}/invoice"
path = "api/tandir/routers/orders.py"
symbol = "get_invoice"
lines = [94, 101]
expected = "rejected"
pair = "order-documents"
anchors = ["return InvoiceOut.from_order(order)"]
guard = "load_order_scoped(db, order_id, user)"
guard_definition = "api/tandir/services/orders.py::load_order_scoped"

[[case]]
id = "TANDIR-A2"
kind = "flaw"
family = "authorization"
cwe = "CWE-863"
title = "Branch manager edits another branch's menu (role checked, branch not)"
route = "PUT /branches/{branch_id}/menu/{item_id}"
path = "api/tandir/routers/branches.py"
symbol = "update_menu_item"
lines = [31, 46]
expected = "supported"
pair = "branch-scope"
anchors = ["user: User = Depends(manager)", "if item is None or item.branch_id != branch_id:"]
fix = { adds = ["if user.branch_id != branch_id:"] }

[[case]]
id = "TANDIR-A2-L"
kind = "lookalike"
family = "authorization"
cwe = "CWE-863"
title = "Branch hours update checks branch membership"
route = "PUT /branches/{branch_id}/hours"
path = "api/tandir/routers/branches.py"
symbol = "update_hours"
lines = [49, 70]
expected = "rejected"
pair = "branch-scope"
anchors = ["user: User = Depends(manager)"]
guard = "if user.branch_id != branch_id:"

[[case]]
