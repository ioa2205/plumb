# Safe handler templates for the mutation corpus (PROJECT_PLAN §10.2).
# Each template is its own template family: variants of one template never
# cross splits. These files are input data; they are never imported or run.

[[templates]]
name = "order_receipt"
family = "authorization"
handler = "get_receipt"
var = "order"
model = "Order"
id_param = "order_id"
owner_field = "customer_id"
principal = "user"
wrong_field = "branch_id"

