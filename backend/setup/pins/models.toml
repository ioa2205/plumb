# Candidate models (PROJECT_PLAN §9). Each entry pins a Hugging Face repository
# revision, file, LFS SHA256, and size, as published on 2026-10-03.
#
# Downloads over 500 MB need the owner's approval (AGENTS.md). Approved so far:
# qwen3.5-2b-q4_k_m (2026-10-03). The others wait for experiment E1.
#
# Qwen publishes no official GGUF for Qwen3.5, so the Qwen files are bartowski's
# llama.cpp quantizations. Gemma 4 E2B uses Google's official QAT Q4_0 GGUF.
#
# kv_bytes_per_token = full-attention layers x KV heads x head dim x 2 (K and V)
# x 2 bytes (f16), from each model's config.json on Hugging Face, checked
# 2026-10-03 (HARDWARE.md, "KV cache"). Gemma 4 E2B mixes sliding-window and
# shared-KV layers, so its value is left out until it is measured.

